      { type: "Discussion Game", title: "Discussion Game", desc: "Open-ended speaking questions about lifelong learning and future goals.", href: "activities/games/discussion/future-academic-goals-discussion-game.html" },
      { type: "Ranking Game", title: "Ranking Game", desc: "Rank learning goals, study plans, and next steps — then defend the order.", href: "activities/games/ranking/future-academic-goals-ranking-game.html" },
      { type: "Guess the Word", title: "Guess the Word", desc: "See three clues and name the goals, next-steps, and school words.", href: "activities/games/guess-the-word/future-academic-goals-guess-the-word-game.html" },
      { type: "Conversation Cards", title: "Conversation Cards", desc: "Print-and-cut flip cards: what comes next, calling a school, what gets in the way, and closing out the year.", href: "activities/games/conversation_cards/Unit10_cards.html" }
    ] }
  ];

  var TYPES = ["Superlative Game", "Discussion Game", "Ranking Game", "Guess the Word", "Conversation Cards"];

  var initialCollapsed = {};
  UNITS.forEach(function (u) { initialCollapsed[u.id] = true; });
  var state = { query: "", type: "All", collapsed: initialCollapsed, allCollapsed: true };

  function svgMarkup(spec, size) {
    var s = size || 20;
    var inner = "";
    (spec.p || []).forEach(function (d) { inner += '<path d="' + d + '"></path>'; });
    (spec.c || []).forEach(function (c) { inner += '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="' + c[2] + '"></circle>'; });
    (spec.r || []).forEach(function (r) { inner += '<rect width="' + r[0] + '" height="' + r[1] + '" x="' + r[2] + '" y="' + r[3] + '" rx="' + r[4] + '"></rect>'; });
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
  }

  function iconFor(unit, act) {
    if (act.icon) return svgMarkup(ICONS[act.icon]);
    if (act.type === "Discussion Game") return svgMarkup(ICONS.disc);
    if (act.type === "Superlative Game") return svgMarkup(ICONS.trophy);
    if (act.type === "Ranking Game") return svgMarkup(ICONS.rank);
    if (act.type === "Guess the Word") return svgMarkup(ICONS.guess);
    if (act.type === "Speaking Cards") return svgMarkup(ICONS.cards);
    if (act.type === "Task Class") return svgMarkup(ICONS.task);
    if (act.type === "Slideshow") return svgMarkup(ICONS.slides);
    return svgMarkup(ICONS[unit.icon]);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function matches(unit, act) {
    var q = state.query.trim().toLowerCase();
    if (state.type !== "All" && act.type !== state.type) return false;
    if (!q) return true;
    return (act.title + " " + act.desc + " " + act.type + " " + unit.title + " " + unit.label).toLowerCase().indexOf(q) > -1;
  }

  var searchIconEl = document.getElementById("search-icon");
  searchIconEl.innerHTML = svgMarkup(ICONS.search, 17);

  var chipGroup = document.getElementById("chip-group");
  var unitList = document.getElementById("unit-list");
  var emptyState = document.getElementById("empty-state");
  var toggleAllBtn = document.getElementById("toggle-all");
  var searchInput = document.getElementById("search-input");

  function render() {
    var searching = state.query.trim().length > 0 || state.type !== "All";
    var counts = { All: 0 };
    TYPES.forEach(function (t) { counts[t] = 0; });
    UNITS.forEach(function (u) {
      u.activities.forEach(function (a) {
        counts.All++;
        counts[a.type] = (counts[a.type] || 0) + 1;
      });
    });

    // Chips
    var chipsHtml = "";
    ["All"].concat(TYPES).forEach(function (t) {
      var active = state.type === t;
      var label = t === "All" ? "All" : t.replace(" Game", "").replace("Task Class", "Task class");
      chipsHtml += '<button type="button" class="chip" data-type="' + escapeHtml(t) + '" aria-pressed="' + active + '">' +
        escapeHtml(label) + '<span class="count">' + (counts[t] || 0) + '</span></button>';
    });
    chipGroup.innerHTML = chipsHtml;

    // Units
    var unitsHtml = "";
    var anyUnits = false;

    UNITS.forEach(function (u) {
      var acts = u.activities.filter(function (a) { return matches(u, a); });
      if (!acts.length) return;
      anyUnits = true;
      var open = searching ? true : !state.collapsed[u.id];

      var cardsHtml = "";
      if (open) {
        acts.forEach(function (a) {
          cardsHtml += '<a class="card" href="' + escapeHtml(a.href) + '" style="border-left-color:' + u.accent + '">' +
            '<span class="card-icon" style="color:' + u.accent + '">' + iconFor(u, a) + '</span>' +
            '<span class="card-text">' +
            '<span class="card-title">' + escapeHtml(a.title) + '</span>' +
            '<span class="card-desc">' + escapeHtml(a.desc) + '</span>' +
            '</span></a>';
        });
      }

      unitsHtml += '<section class="unit">' +
        '<button type="button" class="unit-header" data-unit="' + u.id + '" aria-expanded="' + open + '">' +
        '<span class="unit-icon" style="color:' + u.accent + '">' + svgMarkup(ICONS[u.icon], 22) + '</span>' +
        '<span class="unit-label" style="color:' + u.accent + '">' + escapeHtml(u.label) + '</span>' +
        '<span class="unit-title">' + escapeHtml(u.title) + '</span>' +
        '<span class="unit-count">' + (acts.length === 1 ? "1 activity" : acts.length + " activities") + '</span>' +
        '<span class="unit-chevron' + (open ? "" : " collapsed") + '">' + svgMarkup(ICONS.chevron, 20) + '</span>' +
        '</button>' +
        (open ? '<div class="card-grid">' + cardsHtml + '</div>' : '') +
        '</section>';
    });

    unitList.innerHTML = unitsHtml;
    emptyState.hidden = anyUnits;

    toggleAllBtn.textContent = state.allCollapsed ? "Expand all" : "Collapse all";

    bindDynamicEvents();
  }

  function bindDynamicEvents() {
    chipGroup.querySelectorAll(".chip").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.type = btn.getAttribute("data-type") === "All" ? "All" : btn.getAttribute("data-type");
        render();
      });
    });

    unitList.querySelectorAll(".unit-header").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-unit");
        state.collapsed[id] = !state.collapsed[id];
        render();
      });
    });
  }

  searchInput.addEventListener("input", function (e) {
    state.query = e.target.value;
    render();
  });

  toggleAllBtn.addEventListener("click", function () {
    var collapse = !state.allCollapsed;
    UNITS.forEach(function (u) { state.collapsed[u.id] = collapse; });
    state.allCollapsed = collapse;
    render();
  });

  render();
})();
</script>
</body>
</html>
